version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      # Use MongoDB Atlas or a local service
      - MONGODB_URI=mongodb+srv://maviral456:w9ZvTnAYVQkgxRGv@cluster0.sb16gmb.mongodb.net/ems_database?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=your_jwt_secret_key_here_change_in_production
    depends_on:
      - mongodb
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build: .
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
